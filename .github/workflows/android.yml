name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Unity Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}
          restore-keys: |
            Library-Android-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: UnityBuild.AndroidBuilder.Build
          manualExit: true
          versioning: None
          allowDirtyBuild: true

      - name: Show output
        run: ls -lh build/Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnityBuild-android-apk
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Notify DingTalk
        if: always()
        env:
          DING_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          DING_SECRET: ${{ secrets.DINGTALK_SECRET }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, time, urllib.error, urllib.parse, urllib.request

          token = os.environ.get("DING_TOKEN", "").strip()
          secret = os.environ.get("DING_SECRET", "").strip()
          print(f"[notify] token_length={len(token)} secret={'set' if secret else 'empty'}")
          if not token:
              print("[notify] DINGTALK_TOKEN 为空：请确认 Repository secrets 里存在同名 secret")
              raise SystemExit(1)

          ts = str(round(time.time() * 1000))
          query = f"access_token={token}&timestamp={ts}"
          if secret:
              sign = base64.b64encode(
                  hmac.new(secret.encode(), f"{ts}\n{secret}".encode(), hashlib.sha256).digest()
              ).decode()
              query += "&sign=" + urllib.parse.quote_plus(sign)

          status_map = {"success": "成功", "failure": "失败", "cancelled": "已取消"}
          status = os.environ.get("JOB_STATUS", "unknown")
          text = (
              f"### UnityBuild 构建 {status_map.get(status, status)}\n\n"
              f"- 仓库：{os.environ.get('GITHUB_REPOSITORY')}\n"
              f"- 分支：{os.environ.get('GITHUB_REF_NAME')}\n"
              f"- 提交：{os.environ.get('GITHUB_SHA', '')[:7]}\n"
              f"- [查看运行详情]({os.environ.get('GITHUB_SERVER_URL')}/{os.environ.get('GITHUB_REPOSITORY')}"
              f"/actions/runs/{os.environ.get('GITHUB_RUN_ID')})\n"
          )
          body = json.dumps({"msgtype": "markdown", "markdown": {"title": "UnityBuild", "text": text}},
                            ensure_ascii=False).encode()
          req = urllib.request.Request(
              f"https://oapi.dingtalk.com/robot/send?{query}", body, {"Content-Type": "application/json"})

          try:
              raw = urllib.request.urlopen(req, timeout=15).read().decode()
          except urllib.error.HTTPError as e:
              raw = e.read().decode(errors="replace")
              print(f"[notify] HTTP {e.code}: {raw}")
              raise SystemExit(1)

          print(f"[notify] response: {raw}")
          if json.loads(raw).get("errcode") != 0:
              print("[notify] 钉钉返回非 0 errcode，消息未送达，见上面的 errmsg")
              raise SystemExit(1)
          print("[notify] 发送成功")
          PY
